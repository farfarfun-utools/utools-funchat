name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # 允许手动触发，方便在改 CI 本身时验证。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 同一分支的新提交会取消上一次还在跑的流水线 —— 这里一次推送要占三个 runner，
  # 连推几个提交不取消的话会堆成好几倍。
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # plugin.json 声明支持 darwin / win32 / linux，三个平台就都要真的构建过一次。
    # 只跑 ubuntu 的时候，换行符、大小写敏感的 import、原生依赖的预编译包这些问题
    # 要等用户装上插件才会暴露。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows 作业用 Git Bash 跑同一个 build.sh，不另写一份步骤清单
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # corepack 按 package.json#packageManager 取 pnpm 版本，和 build.sh 的下限检查是同一套
      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          # 这是跑测试工具链的 Node，不是插件运行时的 Node ——  插件跑在 uTools 内置的
          # Chromium 里，拿什么版本构建都不影响产物。而工具链这边 22.10 是硬下限：
          # jsdom 30 依赖 undici 8，后者直接用了 22.10 才有的
          # worker_threads.markAsUncloneable，Node 20 上所有 jsdom 环境的测试文件
          # 一加载就炸（markAsUncloneable is not a function）。
          node-version: 22
          cache: pnpm

      # 这一条就是本地的那道门：install --frozen-lockfile → test → typecheck →
      # lint:check → preload.js 语法 → 版本号一致 → build → 产物齐全。
      # 单独再列一遍脚本只会和 build.sh 慢慢不一致，所以直接跑它。
      #
      # 检查（test / typecheck / lint）只在 ubuntu 那一格跑。另两格要回答的问题是
      # 「这个平台上装得上、构建得出来吗」—— 把同一套测试在最慢的两个 runner 上再跑
      # 两遍不会多发现什么，只是让每次推送多等几分钟（macOS 还按 10 倍分钟数计费）。
      - name: Build gates
        run: sh build.sh
        env:
          SKIP_CHECKS: ${{ matrix.os == 'ubuntu-latest' && '0' || '1' }}

      - name: Package UPXS with organization secrets
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        uses: farfarfun-action/utools-devtools@c48e8ce06b6700d21c73917b3b16d6e5674c13ef # v0.1.4
        with:
          source: utools
          output: release/utools-funchat.upxs
          identity-file: identity.json
          mid: ${{ secrets.UTOOLS_MID }}
          uid: ${{ secrets.UTOOLS_UID }}
          cellphone: ${{ secrets.UTOOLS_CELLPHONE }}
      - name: Checksum UPXS
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        run: cd release && sha256sum utools-funchat.upxs > SHA256SUMS
      - name: Upload UPXS installation preview
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: utools-funchat-upxs-preview
          path: release/
          if-no-files-found: error
